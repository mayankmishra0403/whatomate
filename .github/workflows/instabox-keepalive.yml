name: Instabox keepalive

# Manual fallback for the Instabox free-plan keepalive.
#
# Primary automation lives in workers/instabox-keepalive.js: a Cloudflare
# Worker cron runs every minute and does the pause/resume reset before the
# deadline. This workflow is kept for manual recovery and dry-runs only. It has
# no schedule, so it cannot race the Worker. See agency/INSTABOX_KEEPALIVE.md.
#
# Required repository secret:
#   INSTABOX_API_KEY  (Instabox API key with machines:read + machines:write)
#
# Optional repository variables:
#   INSTABOX_MACHINE_ID  (defaults to the production machine)
#   PUBLIC_READY_URL     (defaults to the production /ready URL)
#
# Optional repository secret:
#   ALERT_WEBHOOK_URL    (Slack/Discord-style webhook for failures)

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Force a pause/resume reset now"
        type: boolean
        default: false
      dry_run:
        description: "Show what would happen without changing anything"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: instabox-keepalive
  cancel-in-progress: false

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Reset the Instabox run window if needed
        env:
          INSTABOX_API_KEY: ${{ secrets.INSTABOX_API_KEY }}
          INSTABOX_MACHINE_ID: ${{ vars.INSTABOX_MACHINE_ID || 'm_agqwaleqeg6hzdoppoerxokgwa' }}
          PUBLIC_READY_URL: ${{ vars.PUBLIC_READY_URL || 'https://whatsapp.oppertunity.xyz/ready' }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          FORCE: ${{ github.event.inputs.force == 'true' && '1' || '0' }}
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '0' }}
          RESET_AFTER_MINUTES: "360"
          SAFETY_MARGIN_MINUTES: "5"
          MIN_AGE_BEFORE_RESET: "60"
          READY_TIMEOUT_SECONDS: "300"
          OP_TIMEOUT_SECONDS: "180"
        run: bash ./scripts/instabox-keepalive.sh
